services:
  fairdraw:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fairdraw-app
    restart: unless-stopped
    ports:
      - "${PORT:-3001}:3001"
    volumes:
      - fairdraw-data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DB_PATH=/app/data/fairdraw.db
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - SESSION_SECRET=${SESSION_SECRET}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3001}
      # Reduce memory usage on low-RAM VDS
      - NODE_OPTIONS=--max-old-space-size=256
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # Limit memory to prevent OOM kills on small VDS
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  fairdraw-data:
    driver: local
